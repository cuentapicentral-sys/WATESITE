services:
  - type: web
    name: wastewise-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "80"
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_SERVICE_API_PREFIX
        value: /services
      - key: BACKEND_HOSTPORT
        fromService:
          name: backend
          type: pserv
          property: hostport
      - key: CONTAINER_SERVICE_HOSTPORT
        fromService:
          name: container-service
          type: pserv
          property: hostport
      - key: ROUTE_SERVICE_HOSTPORT
        fromService:
          name: route-service
          type: pserv
          property: hostport
      - key: FLEET_SERVICE_HOSTPORT
        fromService:
          name: fleet-service
          type: pserv
          property: hostport
      - key: CITIZEN_SERVICE_HOSTPORT
        fromService:
          name: citizen-service
          type: pserv
          property: hostport
      - key: SENSOR_SERVICE_HOSTPORT
        fromService:
          name: sensor-service
          type: pserv
          property: hostport
      - key: REPORTING_SERVICE_HOSTPORT
        fromService:
          name: reporting-service
          type: pserv
          property: hostport
      - key: NOTIFICATION_SERVICE_HOSTPORT
        fromService:
          name: notification-service
          type: pserv
          property: hostport
      - key: ANALYTICS_SERVICE_HOSTPORT
        fromService:
          name: analytics-service
          type: pserv
          property: hostport

  - type: pserv
    name: backend
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: pserv
    name: rabbitmq
    runtime: image
    region: frankfurt
    plan: 0.5c-512mb
    image:
      url: docker.io/library/rabbitmq:3.13-management-alpine
    disk:
      name: rabbitmq-data
      mountPath: /var/lib/rabbitmq
      sizeGB: 1
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: wastewise
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  - type: pserv
    name: container-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: &microservice_env
      - key: SUPABASE_URL
        fromService:
          name: backend
          type: pserv
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          name: backend
          type: pserv
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: RABBITMQ_HOST
        fromService:
          name: rabbitmq
          type: pserv
          property: host
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        fromService:
          name: rabbitmq
          type: pserv
          envVarKey: RABBITMQ_DEFAULT_USER
      - key: RABBITMQ_PASSWORD
        fromService:
          name: rabbitmq
          type: pserv
          envVarKey: RABBITMQ_DEFAULT_PASS

  - type: pserv
    name: route-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env

  - type: pserv
    name: fleet-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env

  - type: pserv
    name: citizen-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env

  - type: pserv
    name: sensor-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env

  - type: pserv
    name: reporting-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env

  - type: pserv
    name: notification-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env

  - type: pserv
    name: analytics-service
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./services/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars: *microservice_env