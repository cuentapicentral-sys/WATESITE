server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${BACKEND_HOSTPORT}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /services/containers/ {
        proxy_pass http://${CONTAINER_SERVICE_HOSTPORT}/;
    }

    location /services/routes/ {
        proxy_pass http://${ROUTE_SERVICE_HOSTPORT}/;
    }

    location /services/fleet/ {
        proxy_pass http://${FLEET_SERVICE_HOSTPORT}/;
    }

    location /services/citizens/ {
        proxy_pass http://${CITIZEN_SERVICE_HOSTPORT}/;
    }

    location /services/sensors/ {
        proxy_pass http://${SENSOR_SERVICE_HOSTPORT}/;
    }

    location /services/reporting/ {
        proxy_pass http://${REPORTING_SERVICE_HOSTPORT}/;
    }

    location /services/notifications/ {
        proxy_pass http://${NOTIFICATION_SERVICE_HOSTPORT}/;
    }

    location /services/analytics/ {
        proxy_pass http://${ANALYTICS_SERVICE_HOSTPORT}/;
    }

    location / {
        try_files $uri $uri/index.html /index.html;
    }
}