name: CI and container publishing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            services/requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt -r services/requirements.txt -r requirements-dev.txt
      - name: Lint Python
        run: flake8 backend services tests --select=E9,F63,F7,F82 --max-line-length=120
      - name: Check formatting
        run: black --check services/start.py services/routes/optimization.py tests
      - name: Test route optimization
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
            module: ""
          - name: backend
            dockerfile: backend/Dockerfile
            context: .
            module: ""
          - name: container-service
            dockerfile: services/Dockerfile
            context: .
            module: services.containers.main
          - name: route-service
            dockerfile: services/Dockerfile
            context: .
            module: services.routes.main
          - name: fleet-service
            dockerfile: services/Dockerfile
            context: .
            module: services.fleet.main
          - name: citizen-service
            dockerfile: services/Dockerfile
            context: .
            module: services.citizens.main
          - name: sensor-service
            dockerfile: services/Dockerfile
            context: .
            module: services.sensors.main
          - name: reporting-service
            dockerfile: services/Dockerfile
            context: .
            module: services.reporting.main
          - name: notification-service
            dockerfile: services/Dockerfile
            context: .
            module: services.notifications.main
          - name: analytics-service
            dockerfile: services/Dockerfile
            context: .
            module: services.analytics.main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}/${{ matrix.name }}:latest
          build-args: |
            SERVICE_MODULE=${{ matrix.module }}